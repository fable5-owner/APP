name: TSMC ADR premium (daily)

on:
  schedule:
    # 미국 장 마감 후, 한국시간 화~토 07:30 (UTC 월~금 22:30)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tsmc-premium/requirements.txt
      - name: Calculate premium
        run: python tsmc-premium/tsmc_premium.py --days 5 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tsmc-premium/data/history.csv
          git diff --cached --quiet || git commit -m "Update TSMC premium history"
          git push
