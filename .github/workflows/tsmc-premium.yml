name: TSMC ADR premium (daily)

on:
  schedule:
    # 미국 장 마감 후, 한국시간 화~토 07:30 (UTC 월~금 22:30)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tsmc-premium/requirements.txt
      - name: Calculate premium
        run: python tsmc-premium/tsmc_premium.py --days 5 --notify --json public/tsmc/data.json | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      - name: Commit history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tsmc-premium/data/history.csv public/tsmc/data.json
          git diff --cached --quiet || git commit -m "Update TSMC premium history"
          git push
      - name: Redeploy site (GITHUB_TOKEN 커밋은 자동 배포를 트리거하지 않음)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
