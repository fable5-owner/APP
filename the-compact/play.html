<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Compact</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>/* THE COMPACT — design system.
   Layout concept: a calm private-bank command room. Dot-matrix world on top, conversations and decisions below.
   Rule of thumb: one accent (ice blue), money is amber, red/green only for meaning. */
:root{
  --bg:#070c16; --bg2:#0c1322; --panel:rgba(16,24,40,.74); --panel-solid:#0f1728; --tint:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --text:#e8edf7; --muted:#8e9ab0; --dim:#5b677e;
  --accent:#86aefc; --accent-d:#5b86d8; --good:#62d6a1; --bad:#ff7b8b; --warn:#f3c978; --money:#f3c978;
  --font:'Inter','Noto Sans KR',system-ui,sans-serif; --serif:'Noto Serif KR','Noto Sans KR',serif; --mono:'JetBrains Mono','Noto Sans KR',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(min(100vw,177.78vh)/120);height:100%;background:var(--bg)}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:.875rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.money{color:var(--money)}
[data-act]{cursor:pointer}
.hidden{display:none!important}

#app{position:fixed;inset:0;display:grid;grid-template-columns:4.6rem 1fr;grid-template-rows:3.7rem 1fr;background:
  radial-gradient(60rem 38rem at 78% -10%,rgba(91,134,216,.12),transparent 60%),
  radial-gradient(50rem 30rem at 0% 110%,rgba(243,201,120,.05),transparent 60%),var(--bg)}
#app.full{display:block}
#app.full .rail,#app.full .top{display:none}
.rail{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:1rem 0;border-right:1px solid var(--line);background:rgba(8,13,24,.6)}
.logo{width:2.4rem;height:2.4rem;border-radius:.7rem;display:grid;place-items:center;font-weight:800;font-size:1rem;letter-spacing:-.02em;color:#08101f;background:linear-gradient(145deg,#cfe0ff,var(--accent));margin-bottom:1rem}
.nav{width:3.6rem;padding:.55rem 0 .4rem;border-radius:.8rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;color:var(--muted);font-size:.64rem;font-weight:600;position:relative;transition:background .15s,color .15s}
.nav svg{width:1.35rem;height:1.35rem}
.nav:hover{background:var(--tint);color:var(--text)}
.nav.on{background:rgba(134,174,252,.12);color:var(--accent)}
.nav.on:before{content:"";position:absolute;left:-.62rem;top:.7rem;bottom:.7rem;width:.18rem;border-radius:.2rem;background:var(--accent)}
.nav .dot{position:absolute;top:.35rem;right:.7rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--bad);box-shadow:0 0 .6rem var(--bad)}
.sp{flex:1}

.top{grid-column:2;display:flex;align-items:center;gap:1.6rem;padding:0 1.6rem;border-bottom:1px solid var(--line);background:rgba(8,13,24,.45);z-index:5}
.qtr{display:flex;flex-direction:column;gap:.25rem}
.qtr b{font-size:1.05rem;letter-spacing:-.01em}
.ticks{display:flex;gap:.18rem}.ticks i{width:.9rem;height:.18rem;border-radius:.1rem;background:var(--line2)}.ticks i.on{background:var(--accent)}.ticks i.cur{background:#fff}
.kpi{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.kpi small{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.kpi b{font-family:var(--mono);font-size:1.02rem;font-weight:600;white-space:nowrap}
.kpi em{font-style:normal;font-size:.7rem;margin-left:.35rem}
.gauge{width:4.4rem;height:.3rem;border-radius:.2rem;background:var(--line2);overflow:hidden;margin-top:.2rem}.gauge i{display:block;height:100%;border-radius:.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:2.5rem;padding:0 1.3rem;border-radius:999px;border:1px solid var(--line2);background:var(--tint);font-weight:600;font-size:.82rem;white-space:nowrap;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#08101f}
.btn.primary:hover{background:#a3c0ff}
.btn.big{height:3rem;padding:0 1.8rem;font-size:.95rem}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn svg{width:1rem;height:1rem}

.main{grid-column:2;position:relative;overflow:hidden;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1rem;}
.ph{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem .6rem;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:.3rem;height:1.55rem;padding:0 .6rem;border-radius:999px;font-size:.7rem;font-weight:600;background:rgba(255,255,255,.06);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);background:rgba(98,214,161,.11)}.chip.bad{color:var(--bad);background:rgba(255,123,139,.11)}.chip.warn{color:var(--warn);background:rgba(243,201,120,.11)}.chip.acc{color:var(--accent);background:rgba(134,174,252,.12)}

/* avatars (no faces: initials + color) */
.av{--s:2.4rem;--c:#9db4d6;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.36);letter-spacing:-.02em;color:#0a1020;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.av.orb{color:#fff;background:radial-gradient(circle at 32% 28%,#fff 0,var(--c) 28%,color-mix(in srgb,var(--c) 45%,#000) 100%);box-shadow:0 0 calc(var(--s)*.5) color-mix(in srgb,var(--c) 55%,transparent);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 calc(var(--s)*.8) color-mix(in srgb,var(--c) 75%,transparent)}}
.av.sq{border-radius:28%}
.av img{width:100%;height:100%;border-radius:inherit;object-fit:cover}

/* ---------- map hub ---------- */
.hub{position:absolute;inset:0;display:grid;grid-template-rows:62% 38%}
.mapslot{position:relative;min-height:0}
.map{position:absolute;inset:0}.map canvas{position:absolute;inset:0}
.map.dim{opacity:.55}
.map-layer{position:absolute;inset:0;pointer-events:none}
.hub .vignette,.mapslot:after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.map-layer>*{position:absolute;pointer-events:auto}
.hubn{transform:translate(-50%,-50%)}
.pin{width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;position:relative;background:rgba(243,201,120,.14);border:1px solid rgba(243,201,120,.7);transition:transform .15s}
.pin i{width:.5rem;height:.5rem;border-radius:50%;background:var(--money);box-shadow:0 0 .8rem var(--money)}
.pin:before{content:"";position:absolute;inset:-.5rem;border-radius:50%;border:1px solid rgba(243,201,120,.45);animation:ping 2.6s ease-out infinite}
.pin:hover{transform:scale(1.18)}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.hubn .lab{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;white-space:nowrap;pointer-events:none;text-shadow:0 1px 8px #000}
.lab.r{left:2.1rem}.lab.l{right:2.1rem;align-items:flex-end;text-align:right}
.lab b{font-size:.78rem;letter-spacing:.04em}.lab small{font-size:.68rem;color:var(--muted);font-family:var(--mono)}
.risk{transform:translate(-50%,-50%);display:flex;align-items:center;gap:.5rem;pointer-events:none!important}
.risk i{width:.55rem;height:.55rem;border-radius:50%;background:var(--bad);box-shadow:0 0 0 .25rem rgba(255,123,139,.18);animation:blink 1.8s ease-in-out infinite}
.risk span{font-size:.66rem;color:#ffb3bd;letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 6px #000}
@keyframes blink{50%{opacity:.35}}
.dock{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:1rem;padding:0 1.4rem 1.2rem;min-height:0}
.dock .panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dock .body{overflow:auto;padding:0 .5rem .7rem;min-height:0}
.thread{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.6rem .6rem;border-radius:.8rem;transition:background .15s}
.thread:hover{background:var(--tint)}
.thread .t{min-width:0}.thread b{font-size:.86rem;display:flex;gap:.5rem;align-items:center}
.thread p{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread.unread{background:rgba(134,174,252,.09);box-shadow:inset 0 0 0 1px rgba(134,174,252,.28)}
.badge{min-width:1.3rem;height:1.3rem;padding:0 .35rem;border-radius:999px;background:var(--accent);color:#08101f;font-size:.7rem;font-weight:800;display:grid;place-items:center}
.row{display:flex;align-items:center;gap:.75rem;padding:.42rem .6rem;border-radius:.7rem}
.row .nm{flex:1;min-width:0;font-size:.82rem;font-weight:600}.row .nm small{display:block;font-size:.68rem;color:var(--muted);font-weight:400}
.meter{height:.32rem;border-radius:.2rem;background:var(--line2);overflow:hidden;width:5.5rem}.meter i{display:block;height:100%;border-radius:.2rem}
.goal{display:flex;gap:.7rem;align-items:flex-start;padding:.5rem .7rem;font-size:.82rem}
.goal i{width:1.05rem;height:1.05rem;border-radius:50%;border:1.5px solid var(--line2);flex:none;margin-top:.12rem;display:grid;place-items:center;font-style:normal;font-size:.62rem;color:#08101f}
.goal.done i{background:var(--good);border-color:var(--good)}
.goal small{display:block;color:var(--muted);font-size:.72rem}
.pop{position:absolute;z-index:6;min-width:15rem;padding:.4rem;border-radius:.9rem;background:var(--panel-solid);border:1px solid var(--line2);box-shadow:0 1.2rem 3rem rgba(0,0,0,.5);transform:translate(-50%,.9rem)}
.pop .row{cursor:pointer}.pop .row:hover{background:var(--tint)}

/* ---------- conversation ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(3,7,14,.66);display:flex;justify-content:center;align-items:stretch;padding:1.4rem 1.6rem;animation:fadein .25s ease both}
@keyframes fadein{from{opacity:0}}
.chat{width:min(58rem,100%);display:flex;flex-direction:column;border-radius:1.2rem;background:linear-gradient(180deg,rgba(18,27,46,.97),rgba(11,17,31,.98));border:1px solid var(--line2);box-shadow:0 2rem 6rem rgba(0,0,0,.6);overflow:hidden;animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(.9rem)}}
.chat-h{display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;border-bottom:1px solid var(--line)}
.stack{display:flex}.stack .av{margin-left:-.6rem;box-shadow:0 0 0 .18rem #0f1728}.stack .av:first-child{margin-left:0}
.chat-h .ti{flex:1;min-width:0}.chat-h .ti small{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.chat-h .ti b{display:block;font-size:1.1rem;letter-spacing:-.01em}
.xbtn{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.xbtn:hover{background:var(--tint);color:var(--text)}
.log{flex:1;overflow:auto;padding:1.4rem 1.6rem .6rem;display:flex;flex-direction:column;gap:1rem;scroll-behavior:smooth}
.msg{display:flex;gap:.8rem;align-items:flex-start;animation:rise .3s ease both;max-width:100%}
.msg .bub{background:var(--tint);border:1px solid var(--line);border-radius:.3rem 1.1rem 1.1rem 1.1rem;padding:.75rem 1rem .8rem;max-width:41rem;font-size:.92rem;line-height:1.65}
.msg .who{display:flex;gap:.55rem;align-items:center;font-size:.72rem;color:var(--muted);margin-bottom:.25rem;font-weight:600}
.msg .who b{color:var(--text);font-size:.78rem}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:rgba(134,174,252,.16);border-color:rgba(134,174,252,.35);border-radius:1.1rem .3rem 1.1rem 1.1rem}
.brief{border-left:2px solid var(--accent);padding:.2rem 0 .2rem 1.1rem;animation:rise .3s ease both}
.brief small{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brief h3{font-family:var(--serif);font-weight:900;font-size:1.55rem;line-height:1.3;margin:.2rem 0 .5rem;letter-spacing:-.01em}
.brief p{color:#c6cfdf;line-height:1.75;max-width:44rem}
.sys{align-self:center;text-align:center;font-size:.76rem;color:var(--muted);animation:rise .3s ease both;max-width:40rem}
.sys .chips{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem}
.sys.res{background:var(--tint);border:1px solid var(--line);border-radius:.9rem;padding:.8rem 1.1rem;color:#cfd7e6;font-size:.84rem;line-height:1.65}
.typing{display:flex;gap:.8rem;align-items:center;animation:rise .2s ease both}
.typing .dots{display:flex;gap:.28rem;padding:.8rem 1rem;border-radius:.3rem 1.1rem 1.1rem 1.1rem;background:var(--tint);border:1px solid var(--line)}
.typing .dots i{width:.38rem;height:.38rem;border-radius:50%;background:var(--muted);animation:tdot 1.1s infinite}.typing .dots i:nth-child(2){animation-delay:.15s}.typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-.2rem)}}
.stance{font-size:.62rem;letter-spacing:.04em;padding:.1rem .5rem;border-radius:999px;font-weight:700}
.stance.y{color:var(--good);background:rgba(98,214,161,.12)}.stance.n{color:var(--bad);background:rgba(255,123,139,.12)}.stance.h{color:var(--warn);background:rgba(243,201,120,.12)}
.tool{display:flex;gap:.6rem;align-items:center;margin-left:3.2rem}
.replies{padding:.9rem 1.4rem 1.3rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.5rem;background:rgba(7,12,22,.5)}
.replies .hint{font-size:.7rem;color:var(--dim);margin-bottom:.1rem}
.reply{display:flex;flex-direction:column;gap:.35rem;text-align:left;padding:.7rem 1rem;border-radius:.9rem;border:1px solid var(--line2);background:var(--tint);transition:border-color .15s,background .15s,transform .1s;animation:rise .3s ease both}
.reply:hover{border-color:var(--accent);background:rgba(134,174,252,.08);transform:translateX(.15rem)}
.reply .l{display:flex;align-items:center;gap:.7rem;font-weight:700;font-size:.9rem}
.reply .l small{font-weight:500;color:var(--muted);font-size:.72rem;margin-left:auto}
.reply .chips{display:flex;flex-wrap:wrap;gap:.3rem}
.reply.off{opacity:.4;pointer-events:none}
.num{width:1.4rem;height:1.4rem;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:.7rem;font-family:var(--mono);color:var(--muted);flex:none}

/* ---------- views ---------- */
.view{position:absolute;inset:0;padding:1.4rem 1.6rem;overflow:auto;animation:fadein .25s ease both}
.split{display:grid;grid-template-columns:23rem 1fr;gap:1.2rem;height:100%}
.list{display:flex;flex-direction:column;gap:.15rem;overflow:auto;padding:.4rem}
.co{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.65rem .75rem;border-radius:.85rem;border:1px solid transparent}
.co:hover{background:var(--tint)}.co.on{background:rgba(134,174,252,.1);border-color:rgba(134,174,252,.35)}
.co b{font-size:.88rem;display:block}.co small{font-size:.7rem;color:var(--muted)}
.co .v{text-align:right;font-family:var(--mono);font-size:.82rem}.co .v small{display:block;font-size:.68rem}
.detail{display:flex;flex-direction:column;gap:1rem;overflow:auto;padding-right:.2rem}
.dh{display:flex;align-items:center;gap:1.1rem;padding:1.1rem 1.3rem}
.dh h2{font-size:1.5rem;letter-spacing:-.02em}.dh .big{margin-left:auto;text-align:right;font-family:var(--mono);font-size:1.6rem;font-weight:600}.dh .big small{display:block;font-size:.68rem;color:var(--muted);font-family:var(--font);letter-spacing:.08em;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:.6rem}
.k{padding:.75rem .9rem;border-radius:.85rem;background:var(--tint);border:1px solid var(--line)}
.k small{display:block;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700}.k b{font-family:var(--mono);font-size:1.05rem;font-weight:600}.k em{font-style:normal;font-size:.68rem;margin-left:.3rem}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:1rem}
.lev{padding:.45rem 0 .6rem}
.lv{padding:.55rem 1.1rem}
.lv .t{display:flex;justify-content:space-between;font-size:.82rem;font-weight:600;margin-bottom:.35rem}.lv .t span{font-family:var(--mono);color:var(--accent)}
.lv small{display:block;font-size:.68rem;color:var(--muted);margin-top:.3rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:.3rem;border-radius:.2rem;outline:none;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.05rem;height:1.05rem;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 .2rem .6rem rgba(0,0,0,.5);cursor:pointer}
input[type=range]::-moz-range-thumb{width:.9rem;height:.9rem;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.fc{padding:1rem 1.2rem;font-size:.82rem;line-height:1.8}
.fc b{font-family:var(--mono)}
svg text{font-family:var(--font)}

.wallet{display:grid;grid-template-columns:24rem 1fr 22rem;gap:1.2rem;height:100%}
.col{display:flex;flex-direction:column;gap:1rem;min-height:0;overflow:auto}
.nw{padding:1.4rem 1.4rem}.nw small{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nw .n{font-family:var(--mono);font-size:3rem;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:.4rem 0 .2rem;color:#fff}
.stackbar{display:flex;height:.7rem;border-radius:.4rem;overflow:hidden;gap:2px}.stackbar i{display:block;height:100%}
.leg{display:grid;grid-template-columns:1fr auto;gap:.35rem .8rem;margin-top:.9rem;font-size:.8rem}.leg span:nth-child(odd){display:flex;align-items:center;gap:.5rem;color:var(--muted)}.leg i{width:.6rem;height:.6rem;border-radius:.2rem}.leg span:nth-child(even){font-family:var(--mono)}
.pay{padding:1.2rem 1.4rem}.pay .cap{position:relative;margin:1.2rem 0 .5rem}.pay .capmark{position:absolute;left:40%;top:-.5rem;bottom:-.5rem;width:2px;background:var(--bad);pointer-events:none}.pay .zone{position:absolute;left:40%;right:0;top:-.1rem;height:.5rem;background:repeating-linear-gradient(135deg,rgba(255,123,139,.35) 0 4px,transparent 4px 8px);border-radius:0 .3rem .3rem 0;pointer-events:none}
.asset{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line)}.asset:last-child{border:0}
.asset b{font-size:.88rem;display:block}.asset small{font-size:.72rem;color:var(--muted)}
.asset .ic{width:2.4rem;height:2.4rem;border-radius:.7rem;background:var(--tint);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}.asset .ic svg{width:1.2rem;height:1.2rem}
.risk-row{display:grid;grid-template-columns:7rem 1fr auto;gap:.8rem;align-items:center;padding:.4rem 1.1rem;font-size:.8rem}

.graph{position:relative;height:100%;display:grid;grid-template-columns:1fr 26rem;gap:1.2rem}
.gwrap{position:relative;border-radius:1rem;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(134,174,252,.08),transparent 60%),var(--panel);border:1px solid var(--line)}
.gnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;transition:transform .15s}
.gnode:hover{transform:translate(-50%,-50%) scale(1.07)}.gnode.on .av{box-shadow:0 0 0 .22rem var(--accent),0 0 2rem rgba(134,174,252,.5)}
.gnode b{font-size:.84rem}.gnode small{font-size:.68rem;color:var(--muted)}
.kes{border:1px dashed var(--line2);border-radius:50%;width:9rem;height:9rem;display:grid;place-items:center;font-family:var(--mono);letter-spacing:.3em;font-size:.75rem;color:var(--muted);background:rgba(255,255,255,.02)}
.clue{display:flex;gap:.7rem;padding:.55rem 1.1rem;border-top:1px solid var(--line);font-size:.84rem}.clue i{font-style:normal;color:var(--good)}.clue small{display:block;color:var(--muted);font-size:.7rem}

.docs{display:grid;grid-template-columns:20rem 1fr;gap:1.2rem;height:100%}
.doc-i{display:flex;gap:.8rem;padding:.8rem 1rem;border-radius:.85rem;align-items:center;border:1px solid transparent}.doc-i.on{background:rgba(134,174,252,.1);border-color:rgba(134,174,252,.35)}.doc-i:hover{background:var(--tint)}.doc-i.lock{opacity:.4}
.reader{padding:2.4rem 3rem;overflow:auto}.reader h2{font-family:var(--serif);font-weight:900;font-size:1.8rem;margin:.3rem 0 1.4rem;letter-spacing:-.01em}.reader .tx{font-family:var(--serif);font-size:1.12rem;line-height:2.05;white-space:pre-line;color:#d6deec;max-width:40rem}.reader .sig{margin-top:1.8rem;color:var(--muted);font-style:italic;font-family:var(--serif)}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.pcard{display:flex;gap:1.1rem;padding:1.2rem 1.3rem;align-items:flex-start}.pcard h3{font-size:1.05rem}.pcard p{font-size:.8rem;color:#b7c1d3;line-height:1.65;margin-top:.5rem}

/* ---------- full-screen screens ---------- */
.screen{position:absolute;inset:0;animation:fadein .4s ease both}
.full-map{position:absolute;inset:0}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,12,22,.88) 0,rgba(7,12,22,.55) 38%,rgba(7,12,22,.05) 75%)}
.title-wrap{position:absolute;left:8%;top:50%;transform:translateY(-52%);max-width:50rem}
.eyebrow{font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wordmark{font-family:var(--font);font-weight:800;font-size:6.6rem;letter-spacing:-.045em;line-height:.95;margin:1rem 0 1.2rem;background:linear-gradient(180deg,#fff 20%,#9db4e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-family:var(--serif);font-weight:600;font-size:1.7rem;color:#d3dbea;letter-spacing:-.01em}
.lede{color:var(--muted);line-height:1.85;max-width:34rem;margin:1.1rem 0 2.2rem;font-size:.95rem}
.title-actions{display:flex;gap:.8rem;flex-wrap:wrap}
.dots11{display:flex;gap:.45rem;margin-top:3rem}.dots11 .av{--s:1.9rem}
.fine{position:absolute;left:8%;bottom:1.8rem;font-size:.7rem;color:var(--dim)}
.quote-side{position:absolute;right:7%;bottom:3rem;max-width:27rem;font-family:var(--serif);font-size:.95rem;line-height:1.9;color:#b7c1d3;border-right:2px solid var(--accent);padding-right:1.1rem;text-align:right}

.origin{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:4rem;padding:5rem 8%;align-content:center}
.origin h2{font-family:var(--serif);font-weight:900;font-size:2.6rem;letter-spacing:-.02em;margin:.8rem 0 .8rem}
.opt{display:block;width:100%;text-align:left;padding:1.2rem 1.4rem;border-radius:1rem;border:1px solid var(--line);background:var(--tint);margin-bottom:.8rem;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2);background:rgba(255,255,255,.05)}.opt.on{border-color:var(--accent);background:rgba(134,174,252,.1)}
.opt b{font-size:1.1rem}.opt small{display:block;color:var(--muted);margin-top:.2rem;font-size:.8rem}
.field{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.1rem;border-radius:.9rem;border:1px solid var(--line2);background:var(--tint);margin:1.4rem 0 1.2rem}
.field label{font-size:.66rem;letter-spacing:.14em;color:var(--muted);font-weight:700}.field input{background:none;border:0;outline:0;font-size:1.05rem;font-weight:600;flex:1;min-width:0}
.trait{padding:1.4rem 1.5rem}.trait h3{font-size:1.25rem;margin:.4rem 0 .3rem}.trait p{color:#c0c9d9;line-height:1.75;font-size:.9rem}

.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 8% 7%;background:radial-gradient(60rem 36rem at 50% 30%,rgba(91,134,216,.14),transparent 70%),linear-gradient(180deg,#0a1020,#05080f)}
.scene .loc{position:absolute;top:2.4rem;left:2.6rem;font-size:.72rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;font-weight:700}
.scene .skip{position:absolute;top:2rem;right:2.4rem}
.scene .stage-text{width:min(56rem,100%);min-height:15rem;display:flex;flex-direction:column;justify-content:flex-end}
.speaker{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;font-weight:700;font-size:.95rem}.speaker small{color:var(--muted);font-weight:500}
.line{font-family:var(--serif);font-weight:600;font-size:1.65rem;line-height:1.75;color:#eef2fa;animation:rise .5s ease both;letter-spacing:-.01em}
.line.narr{color:#aab6cc;font-style:italic;font-weight:400}
.hintc{margin-top:1.4rem;font-size:.72rem;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;animation:blink 2s infinite}
.choices{display:flex;flex-direction:column;gap:.5rem;margin-top:1.4rem}
.choice{text-align:left;padding:.85rem 1.2rem;border-radius:.9rem;border:1px solid var(--line2);background:var(--tint);font-family:var(--serif);font-size:1.12rem;font-weight:600;transition:border-color .15s,background .15s,transform .1s;animation:rise .45s ease both}
.choice:hover{border-color:var(--accent);background:rgba(134,174,252,.09);transform:translateX(.2rem)}.choice small{display:block;font-family:var(--font);font-size:.72rem;color:var(--muted);font-weight:500;margin-top:.15rem}

.sheet{position:absolute;inset:0;z-index:25;display:grid;grid-template-columns:1fr 1fr;gap:3rem;padding:3.2rem 6%;background:radial-gradient(60rem 36rem at 80% 0,rgba(91,134,216,.18),transparent 60%),#050911;animation:fadein .3s ease both;overflow:auto}
.sheet h2{font-size:.78rem;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;font-weight:700}
.sheet h1{font-size:2.4rem;letter-spacing:-.03em;margin:.5rem 0 1.8rem}
.bign{font-family:var(--mono);font-weight:600;font-size:3.6rem;letter-spacing:-.04em;line-height:1.1}
.bign small{display:block;font-family:var(--font);font-size:.7rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:.3rem}
.cr{display:grid;grid-template-columns:8.5rem 1fr 4.5rem 4rem;gap:.8rem;align-items:center;padding:.38rem 0;font-size:.82rem}.cr .bt{height:.45rem;border-radius:.3rem;background:var(--line);position:relative}.cr .bt i{display:block;height:100%;border-radius:.3rem}.cr .bt u{position:absolute;left:50%;top:-.25rem;bottom:-.25rem;width:1px;background:rgba(255,255,255,.6)}
.take{margin-top:1.6rem;padding:1.4rem 1.6rem;border-radius:1.1rem;background:linear-gradient(135deg,rgba(243,201,120,.14),rgba(243,201,120,.03));border:1px solid rgba(243,201,120,.35)}
.take .bign{color:var(--money)}

.ending{position:absolute;inset:0;overflow:auto;padding:5rem 10%;background:radial-gradient(70rem 40rem at 50% -10%,rgba(91,134,216,.2),transparent 60%),var(--bg)}
.ending .en{font-size:.74rem;letter-spacing:.3em;color:var(--accent);font-weight:700}.ending h1{font-family:var(--serif);font-weight:900;font-size:4.2rem;letter-spacing:-.03em;line-height:1.15;margin:.8rem 0}
.ending .sub2{color:var(--muted);letter-spacing:.14em;font-size:.78rem;text-transform:uppercase}
.ending .story{max-width:42rem;margin:2.2rem 0;font-family:var(--serif);font-size:1.2rem;line-height:2.1;color:#d4dcea}.ending .story p{margin-bottom:1.1rem}
.ending .q{font-family:var(--serif);color:var(--muted);font-style:italic;border-left:2px solid var(--accent);padding-left:1.2rem;max-width:40rem;margin-bottom:2.4rem}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:46rem}.score{padding:1.2rem 1.3rem}.score small{font-size:.66rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:700}.score b{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:1.5rem;margin-top:.3rem}.score b em{font-style:normal;font-size:2rem;color:var(--accent);font-family:var(--font);font-weight:800}
.after{display:grid;grid-template-columns:repeat(2,minmax(0,22rem));gap:.8rem 2rem;margin:2.2rem 0}.after div{display:flex;gap:.8rem;align-items:center;font-size:.84rem;color:#b9c3d6}.after b{color:var(--text);display:block}

.modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,7,14,.7);animation:fadein .25s ease both;padding:1.5rem}
.card{max-width:46rem;padding:2rem 2.3rem;border-radius:1.2rem;background:var(--panel-solid);border:1px solid var(--line2);box-shadow:0 2rem 6rem rgba(0,0,0,.6);animation:rise .3s ease both}
.card h2{font-family:var(--serif);font-weight:900;font-size:1.6rem;margin:.3rem 0 1rem}.card ol{padding-left:1.2rem;line-height:2;color:#c6cfdf}.card li b{color:var(--text)}
#rotate{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--muted);align-items:center;justify-content:center;text-align:center;line-height:1.9;padding:2rem}
@media (max-aspect-ratio: 1/1){#rotate{display:flex}}
.loading{position:fixed;inset:0;z-index:150;background:var(--bg);display:grid;place-items:center;color:var(--muted);letter-spacing:.3em;font-size:.8rem;transition:opacity .4s}
.loading.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ======== SPECTACLE LAYER ======== */
#app:before,#app:after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;opacity:.5}
#app:before{width:60rem;height:40rem;left:-12rem;top:-14rem;background:radial-gradient(circle,rgba(91,134,216,.55),transparent 65%);animation:aur1 22s ease-in-out infinite alternate}
#app:after{width:55rem;height:38rem;right:-14rem;bottom:-16rem;background:radial-gradient(circle,rgba(199,155,255,.32),rgba(243,201,120,.14) 50%,transparent 70%);animation:aur2 28s ease-in-out infinite alternate}
@keyframes aur1{to{transform:translate(30rem,14rem) scale(1.3)}}
@keyframes aur2{to{transform:translate(-26rem,-12rem) scale(1.25)}}
.rail,.top,.main{position:relative;z-index:1}
.panel{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1.2rem 3rem rgba(0,0,0,.35);background:linear-gradient(180deg,rgba(26,38,64,.62),rgba(12,19,34,.72))}
.panel:hover{border-color:rgba(134,174,252,.22)}
.btn.primary{background:linear-gradient(135deg,#b6ceff,#7ea6fb 55%,#9a8bff);border:0;color:#07101f;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 .5rem 1.6rem rgba(110,150,255,.55),0 0 2.4rem rgba(134,174,252,.35);position:relative;overflow:hidden;font-weight:800}
.btn.primary:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.btn.primary:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 .7rem 2.2rem rgba(110,150,255,.8),0 0 3.4rem rgba(134,174,252,.55)}
.logo{box-shadow:0 0 1.6rem rgba(134,174,252,.7),0 0 .1rem #fff inset;animation:logo 4s ease-in-out infinite}
@keyframes logo{50%{box-shadow:0 0 2.6rem rgba(199,155,255,.9),0 0 .1rem #fff inset}}
.nav.on{box-shadow:0 0 1.4rem rgba(134,174,252,.28) inset}
.nav.on:before{box-shadow:0 0 .8rem var(--accent)}
.kpi b{text-shadow:0 0 1rem rgba(134,174,252,.35)}
.kpi b.money,.money{text-shadow:0 0 1.2rem rgba(243,201,120,.5)}
.kpi.flash b{animation:kflash .9s ease}
@keyframes kflash{0%{transform:scale(1.25);color:#fff;text-shadow:0 0 2rem #fff}100%{transform:none}}
.top{background:linear-gradient(180deg,rgba(14,22,40,.85),rgba(8,13,24,.55))}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(134,174,252,.7),rgba(243,201,120,.6),transparent);background-size:200% 100%;animation:slide 6s linear infinite}
@keyframes slide{to{background-position:200% 0}}
.thread.unread{animation:pulsebox 2s ease-in-out infinite}
@keyframes pulsebox{50%{box-shadow:inset 0 0 0 1px rgba(134,174,252,.7),0 0 1.8rem rgba(134,174,252,.35)}}
.badge{box-shadow:0 0 1rem var(--accent)}
.chat{box-shadow:0 0 0 1px rgba(134,174,252,.25),0 2rem 7rem rgba(0,0,0,.7),0 0 6rem rgba(91,134,216,.28)}
.scrim{background:radial-gradient(60rem 40rem at 50% 40%,rgba(30,50,100,.45),rgba(3,6,12,.82))}
.msg .bub{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025))}
.reply:hover{box-shadow:0 0 2rem rgba(134,174,252,.28),0 0 0 1px rgba(134,174,252,.5) inset}
.brief h3{text-shadow:0 0 2.4rem rgba(134,174,252,.35)}
.pin{box-shadow:0 0 1.8rem rgba(243,201,120,.7)}
.hubn .lab b{text-shadow:0 0 .8rem rgba(243,201,120,.8),0 1px 8px #000}
.risk i{box-shadow:0 0 0 .3rem rgba(255,123,139,.25),0 0 1.4rem var(--bad)}
.mapslot:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
/* title cinematic */
.full-map .map{animation:drift 46s ease-in-out infinite alternate;transform-origin:25% 40%}
@keyframes drift{from{transform:scale(1.06) translateX(0)}to{transform:scale(1.28) translateX(-5%)}}
.shade:after{content:"";position:absolute;inset:0;background:radial-gradient(50rem 28rem at 24% 50%,rgba(134,174,252,.18),transparent 70%),radial-gradient(circle at 50% 120%,rgba(243,201,120,.12),transparent 50%)}
.wordmark{background:linear-gradient(100deg,#fff 10%,#9ec0ff 35%,#fff 50%,#f3c978 65%,#9ec0ff 90%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wm 6s linear infinite;position:relative}
@keyframes wm{to{background-position:-250% 0}}
.wordmark{animation:wm 6s linear infinite,wmin 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes wmin{from{opacity:0;letter-spacing:.25em}}
.eyebrow{animation:wmin 1.6s ease both}
.tagline{animation:rise 1.4s .5s ease both}.lede,.title-actions,.dots11{animation:rise 1.4s .9s ease both}
.dots11 .av{animation:bob 3s ease-in-out infinite;box-shadow:0 0 1rem color-mix(in srgb,var(--c) 70%,transparent)}
.dots11 .av:nth-child(2n){animation-delay:-.5s}.dots11 .av:nth-child(3n){animation-delay:-1.1s}
@keyframes bob{50%{transform:translateY(-.35rem)}}
.quote-side{animation:rise 1.6s 1.4s ease both}
/* earnings */
.sheet{background:radial-gradient(60rem 36rem at 80% 0,rgba(91,134,216,.3),transparent 60%),radial-gradient(40rem 30rem at 0 100%,rgba(243,201,120,.14),transparent 60%),#050911}
.sheet.crash{background:radial-gradient(60rem 36rem at 50% 0,rgba(255,60,90,.35),transparent 60%),#0a0509}
.bign{text-shadow:0 0 2.4rem rgba(134,174,252,.4)}.take .bign{text-shadow:0 0 2.6rem rgba(243,201,120,.7)}
.cr .bt i{box-shadow:0 0 .8rem currentColor;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.cr{animation:rise .5s ease both}
.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-8px,3px)}40%,60%{transform:translate(8px,-3px)}}
.mute{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;color:var(--muted);margin-top:.4rem}.mute:hover{color:var(--text);background:var(--tint)}.mute svg{width:1.2rem;height:1.2rem}
.mute.float{position:absolute;top:1.6rem;right:2rem;z-index:9;background:var(--tint);border:1px solid var(--line2)}
.ending h1{background:linear-gradient(100deg,#fff,#9ec0ff,#f3c978,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wm 7s linear infinite;}

/* ---- characters ---- */
.av.ch{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 55%,#fff 0%),color-mix(in srgb,var(--c) 38%,#0b1220));overflow:hidden;font-size:0;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28),0 0 1rem color-mix(in srgb,var(--c) 40%,transparent)}
.av.ch .chsvg{width:112%;height:112%;margin:-4% -6% 0;display:block}
.av.ch.sq{border-radius:30%}
.chsvg{overflow:visible}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.portrait{height:var(--h);aspect-ratio:1;position:relative;filter:drop-shadow(0 1.2rem 1.6rem rgba(0,0,0,.55));animation:idle 3.6s ease-in-out infinite}
.portrait:before{content:"";position:absolute;left:8%;right:8%;bottom:-.4rem;height:1.2rem;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%);filter:none;opacity:.7}
.portrait svg{width:100%;height:100%;position:relative}
@keyframes idle{50%{transform:translateY(-.5rem) rotate(.8deg)}}
.scene .portrait.big{position:absolute;right:11%;bottom:8%;--h:30rem;animation:idle 3.6s ease-in-out infinite,popin .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes popin{from{opacity:0;transform:translateY(3rem) scale(.8)}}
.scene .stage-text{width:min(46rem,100%);align-self:flex-start;margin-left:6%}
.lineup{position:absolute;right:3%;bottom:2rem;display:flex;align-items:flex-end;gap:0;z-index:2}
.lu{display:flex;flex-direction:column;align-items:center;margin-left:-2.2rem;animation:rise 1s ease both;position:relative}
.lu small{margin-top:.2rem;font-size:.68rem;font-weight:700;color:#cdd7ea;text-shadow:0 1px 6px #000;letter-spacing:.04em}
.lu .portrait{animation-duration:4s}
.lu:nth-child(2n) .portrait{animation-delay:-1s}.lu:nth-child(3n) .portrait{animation-delay:-2s}
.lu.star{z-index:3;margin:0 -.4rem 0 -.2rem}.lu.star small{color:#fff;font-size:.8rem}
.msg .av{--s:3.1rem}
.cameo .bub{border-color:rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,210,90,.1),rgba(255,255,255,.03))}
.cameo .who:after{content:"CAMEO";font-size:.56rem;letter-spacing:.14em;padding:.05rem .4rem;border-radius:999px;background:rgba(255,210,90,.16);color:#ffd24a;font-weight:800}
.chat-h .stack .av{--s:3rem}
.hubn .mascot{display:none}
.lineup{right:1.5%;bottom:2.8rem}.lu{margin-left:-4.2rem}.lu:first-child{margin-left:0}
.fine{max-width:34%}

/* ---- cinematic scene backdrops ---- */
.scene{background:#05080f}
.sc-bg{position:absolute;inset:0;overflow:hidden;animation:fadein 1s ease both}
.sc-svg{position:absolute;inset:0;width:100%;height:100%;animation:push 30s ease-in-out infinite alternate;transform-origin:60% 50%}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.12)}}
.bokeh{position:absolute;inset:0;mix-blend-mode:screen}
.bokeh i{position:absolute;border-radius:50%;animation:bk 6s ease-in-out infinite;opacity:.0}
@keyframes bk{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:.75;transform:scale(1.15) translateY(-1rem)}}
.rain{position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(100deg,transparent 0 14px,rgba(190,215,255,.22) 14px 15px,transparent 15px 30px);background-size:100% 100%;animation:rain .55s linear infinite}
@keyframes rain{to{background-position:-30px 60px}}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 .5px,transparent .5px 3px),repeating-radial-gradient(circle at 83% 71%,#000 0 .5px,transparent .5px 4px);animation:gr 1.2s steps(4) infinite}
@keyframes gr{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}}
.sc-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(2,4,9,.8) 100%),linear-gradient(180deg,rgba(2,4,9,.5),transparent 25%,transparent 55%,rgba(2,4,9,.9))}
.scene>*:not(.sc-bg){position:relative;z-index:2}
.scene .portrait.big,.scene .loc,.scene .skip{position:absolute}

/* ======== v3: cinematic chat ======== */
.chat{position:relative;width:min(64rem,100%)}
.banner{position:relative;height:15.5rem;flex:none;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.12)}
.banner .sc-bg{animation:none}
.bn-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,15,.1) 30%,rgba(9,14,26,.92) 100%),linear-gradient(90deg,rgba(5,8,15,.75),transparent 55%)}
