<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Compact</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>:root{--ink:#2b1d10;--gold:#d8b25e;--gold2:#f3d98f;--leather:#2a1b11;--leather2:#1a110a;--paper:#e9dcb8;color-scheme:dark}#loading{position:absolute;inset:0;background:#140d07;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#d8b25e;font-family:Cinzel,serif;letter-spacing:6px;z-index:99}#loading small{font-family:"Noto Sans KR",sans-serif;letter-spacing:0;color:#9a8a68;font-size:14px}body{background:#140d07}
/* THE COMPACT — styles. Base tokens + components + per-screen rules (prefixed .sNN). */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0804;overflow:hidden}
body{font-family:'Noto Serif KR',serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#140d07}
#bg{position:absolute;left:0;top:0;width:1920px;height:1080px;transition:filter .5s}
#bg.dim{filter:sepia(.4) brightness(.5) blur(2px)}
#bg.none{filter:none}
#bg.hide{visibility:hidden}
.screen{position:absolute;inset:0}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
[data-act]{cursor:pointer}
[data-act]:hover{filter:brightness(1.1)}
.disabled{opacity:.45;pointer-events:none;filter:grayscale(.6)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:#3a2c1c;box-shadow:inset 0 1px 3px #000;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c8,#c9a45a);border:2px solid #4a2f0a;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#c9a45a;border:2px solid #4a2f0a}
.modal{position:absolute;inset:0;background:rgba(10,6,3,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.letterbox{width:760px;padding:44px 56px;font-size:18px;line-height:1.95;font-weight:600;color:#3b2a18;white-space:pre-line}
.letterbox h2{font-weight:900;font-size:28px;color:#3a2410;margin-bottom:6px}
.letterbox .sig{margin-top:18px;text-align:right;font-style:italic;color:#7a5a2a}
.letterbox .seal2{position:absolute;right:46px;top:-26px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9453a,#7b1710);border:3px solid #5e100a;box-shadow:0 4px 10px #000a;display:flex;align-items:center;justify-content:center;color:#f7d9a2;font-family:Cinzel;font-weight:800;font-size:24px}
.artimg{display:block;width:100%;height:100%;object-fit:cover}

:root{--ink:#2b1d10;--gold:#d8b25e;--gold2:#f3d98f;--leather:#2a1b11;--leather2:#1a110a;--paper:#e9dcb8;--red:#8a1d14;--grn:#1f6b2e}

.abs{position:absolute}
.bgimg{position:absolute;inset:0;background-size:cover}
.sans{font-family:'Noto Sans KR',sans-serif}
.cz{font-family:Cinzel,serif}
.gold{color:var(--gold2)}
/* parchment */
.parch{background:
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .1  0 0 0 .2 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"),
 radial-gradient(ellipse at 30% 15%,#f3e8c8,#dccb9c 70%,#c7b280);
 border-radius:6px;box-shadow:0 0 0 3px #5a4222,0 0 0 6px var(--gold),0 18px 40px #000b;position:relative;color:var(--ink)}
.parch:before{content:"";position:absolute;inset:8px;border:1.5px solid #8a6f3e;border-radius:3px;pointer-events:none}
.leather{background:linear-gradient(#34231a,#1d130d);border:2px solid var(--gold);border-radius:6px;box-shadow:0 0 0 3px #120a05,0 14px 34px #000c;color:#eadfc4;position:relative}
.plate{background:linear-gradient(#e8dbb6,#cfbf93);border:2px solid #6b5330;border-radius:6px;box-shadow:inset 0 0 8px #7a603a88}
.kick{font-family:Cinzel;font-weight:600;letter-spacing:4px;font-size:11px;color:#7a5a2a}
.h1{font-weight:900;font-size:30px;color:#3a2410}
/* top bar */
.top{position:absolute;left:0;top:0;width:1920px;height:62px;background:linear-gradient(#3a2616,#24160c);border-bottom:3px solid var(--gold);box-shadow:0 5px 18px #000a;display:flex;align-items:center;padding:0 22px;gap:12px;z-index:20}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:2px;background:#6b5330}
.crown{font-family:Cinzel;font-weight:800;color:var(--gold);font-size:18px;letter-spacing:3px;margin-right:14px;text-shadow:0 2px 0 #000a}
.ledger{display:flex;align-items:center;gap:8px;background:linear-gradient(#e8dbb6,#cfbf93);border:2px solid #6b5330;border-radius:6px;padding:4px 14px 4px 6px;height:44px;box-shadow:inset 0 0 8px #7a603a88;color:var(--ink)}
.ledger .ic{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d8,#b9a06a);border:2px solid #6b5330;display:flex;align-items:center;justify-content:center;font-size:16px}
.ledger b{display:block;font-family:'Noto Sans KR';font-weight:700;font-size:15px;line-height:1.1}
.ledger small{display:block;font-family:'Noto Sans KR';font-size:10.5px;line-height:1.1}
.up{color:#1f6b2e}.dn{color:#9b2a1d}
.sp{flex:1}
.date{font-family:Cinzel;font-weight:800;color:var(--gold);text-align:right;font-size:15px;letter-spacing:2px;line-height:1.3}
.date small{display:block;font-family:'Noto Sans KR';font-weight:400;letter-spacing:0;color:#cdb98c;font-size:11px}
/* nav tabs */
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:10px;z-index:20}
.tab{height:52px;padding:0 22px;border-radius:26px;background:linear-gradient(#3a2616,#24160c);border:2px solid #6b5330;color:#cdb98c;font-family:'Noto Sans KR';font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 14px #000a}
.tab.on{background:linear-gradient(#e7c670,#b9892d);color:#2a1a05;border-color:#fff1c0;box-shadow:0 0 0 3px #3a2616,0 6px 14px #000a}
.btn{height:50px;padding:0 28px;border-radius:26px;background:radial-gradient(circle at 50% 20%,#e7c670,#9b6f1f);border:3px solid #4a2f0a;box-shadow:0 0 0 3px var(--gold),0 8px 18px #000b;display:inline-flex;align-items:center;justify-content:center;font-family:Cinzel;font-weight:800;font-size:17px;letter-spacing:3px;color:#2b1a05;text-shadow:0 1px 0 #ffe9b0}
.btn.ghost{background:linear-gradient(#3a2616,#24160c);color:var(--gold2);border-color:#6b5330;box-shadow:0 6px 14px #000a;text-shadow:none}
/* frames */
.frame{border:4px solid var(--gold);border-radius:6px;box-shadow:0 0 0 3px #2a1b11,0 10px 30px #000b;overflow:hidden;background:#241810;position:relative}
.frame svg{display:block}
.cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#2a1b11cc,#150d07);color:var(--gold);font-family:Cinzel;font-weight:800;font-size:12px;letter-spacing:2px;text-align:center;padding:7px 0 9px;border-top:2px solid var(--gold)}
.cap small{display:block;font-family:'Noto Sans KR';font-weight:400;color:#cdb98c;letter-spacing:0;font-size:11px;margin-top:2px}
.bar{height:8px;border-radius:5px;background:#3a2c1c;overflow:hidden;box-shadow:inset 0 1px 2px #000a}
.bar i{display:block;height:100%;border-radius:5px}
.eff{font-family:'Noto Sans KR';font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:10px;background:#f6edd0;border:1px solid #8a6f3e;white-space:nowrap;color:var(--ink)}
.eff.g{color:#1f6b2e;border-color:#4f8a5a}.eff.r{color:#9b2a1d;border-color:#b0584c}
.seal{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel;font-weight:800;font-size:15px;color:#fbe7b4;border:2px solid rgba(255,230,170,.5);box-shadow:0 4px 10px #000a,inset 0 -4px 6px #0006}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:'Noto Sans KR';font-weight:700;font-size:12px;padding:3px 10px;border-radius:12px;background:#2a1b11;color:var(--gold2);border:1px solid #6b5330}

/* ---- screen 01 ---- */
.s01 .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(20,10,4,.25),rgba(12,6,2,.88) 75%),linear-gradient(90deg,rgba(12,6,2,.2),rgba(12,6,2,.85))}
.s01 .arch{position:absolute;left:120px;top:130px;width:560px;height:760px;border:6px solid var(--gold);border-radius:280px 280px 10px 10px;overflow:hidden;box-shadow:0 0 0 6px #1a110a,0 0 0 8px #6b5330,0 0 90px #f3d98f55,0 30px 60px #000c;background:#241810}
.s01 .arch .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 0 16px;text-align:center;background:linear-gradient(transparent,#150d07f2 40%);color:var(--gold2)}
.s01 .arch .nm b{font-family:Cinzel;font-weight:800;letter-spacing:6px;font-size:22px;display:block}
.s01 .arch .nm span{font-family:'Noto Sans KR';font-size:13px;color:#cdb98c}
.s01 .title{position:absolute;left:820px;top:96px;width:1060px}
.s01 .title .t1{font-family:Cinzel;font-weight:800;font-size:106px;letter-spacing:12px;white-space:nowrap;line-height:1;background:linear-gradient(#fff3c8,#e0b455 55%,#8f6420);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 14px #000c)}
.s01 .title .t2{font-weight:900;font-size:40px;color:#f4e6c0;margin-top:10px;letter-spacing:2px;text-shadow:0 4px 12px #000}
.s01 .title .t3{font-family:'Noto Sans KR';font-size:16px;color:#cdb98c;margin-top:16px;line-height:1.7;max-width:900px}
.s01 .menu{position:absolute;left:820px;top:520px;display:flex;flex-direction:column;gap:14px;width:520px}
.s01 .mi{height:62px;border-radius:6px;background:linear-gradient(#3a2616d9,#24160cd9);border:2px solid #6b5330;color:#e9dcb8;font-weight:900;font-size:21px;display:flex;align-items:center;padding:0 26px;gap:16px;box-shadow:0 8px 18px #000a}
.s01 .mi.on{background:linear-gradient(#e7c670,#b9892d);color:#2a1a05;border-color:#fff1c0;box-shadow:0 0 0 3px #3a2616,0 0 30px #f3d98f66}
.s01 .mi small{margin-left:auto;font-family:'Noto Sans KR';font-weight:400;font-size:13px;opacity:.8}
.s01 .seals{position:absolute;left:820px;bottom:84px;display:flex;gap:12px}
.s01 .foot{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:'Noto Sans KR';font-size:12px;color:#8f7d58}
.s01 .env{position:absolute;right:110px;top:560px;width:260px;color:#e9dcb8;font-family:'Noto Sans KR';font-size:13px;line-height:1.7;text-align:right;border-right:3px solid var(--gold);padding-right:18px}
.s01 .env i{font-style:italic;font-family:'Noto Serif KR';font-weight:600;color:var(--gold2);font-size:15px}
/* ---- screen 02 ---- */
.s02 .room{position:absolute;inset:0;background:
 repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 3px,transparent 3px 140px),
 linear-gradient(#4a3020,#2a1a10 60%,#1a0f08)}
.s02 .win{position:absolute;right:150px;top:100px;width:330px;height:400px;border:10px solid #3a2616;box-shadow:0 0 0 4px #6b5330,inset 0 0 40px #000a;background:linear-gradient(#f2a05a,#c75d4a 40%,#4b3a6a 80%,#22204a);overflow:hidden}
.s02 .win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;background:#3a2616;transform:translateX(-50%)}
.s02 .win:after{content:"";position:absolute;top:50%;left:0;right:0;height:8px;background:#3a2616}
.s02 .skyline{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,#150d07);}
.s02 .table{position:absolute;z-index:5;left:0;right:0;bottom:196px;height:92px;background:linear-gradient(#5a3a22,#2a180c);border-top:6px solid #7a5230;box-shadow:0 -20px 40px #0008}
.s02 .lamp{position:absolute;left:300px;top:60px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,214,140,.38),transparent 70%)}
.s02 .chap{position:absolute;left:36px;top:30px;padding:12px 24px;background:linear-gradient(#3a2616e6,#24160ce6);border:2px solid var(--gold);border-radius:4px;color:var(--gold2)}
.s02 .chap .kick{color:#cdb98c}
.s02 .chap b{display:block;font-size:22px;font-weight:900;margin-top:2px}
.s02 .sys{position:absolute;right:36px;top:30px;display:flex;gap:10px}
.s02 .sys span{padding:8px 16px;border-radius:18px;background:#24160ce6;border:1px solid #6b5330;color:#cdb98c;font-family:'Noto Sans KR';font-size:12px;font-weight:700}
.s02 .chars{position:absolute;z-index:3;left:0;right:0;bottom:250px}
.s02 .ch{position:absolute;bottom:0;filter:drop-shadow(0 20px 20px #000c)}
.s02 .ch .frame{border:none;box-shadow:none;background:none;overflow:visible}
.s02 .ch svg{border-radius:8px 8px 0 0;-webkit-mask-image:linear-gradient(#000 78%,transparent)}
.s02 .dim{filter:brightness(.55) saturate(.7) drop-shadow(0 20px 20px #000c)}
.s02 .dlg{position:absolute;z-index:6;left:120px;right:120px;bottom:28px;height:162px;padding:22px 40px 18px 40px}
.s02 .name{position:absolute;left:34px;top:-22px;padding:6px 26px;background:linear-gradient(#e7c670,#b9892d);border:2px solid #fff1c0;color:#2a1a05;font-weight:900;font-size:19px;border-radius:4px;box-shadow:0 6px 14px #000a}
.s02 .name small{font-family:'Noto Sans KR';font-weight:400;font-size:12px;margin-left:10px;opacity:.8}
.s02 .txt{font-size:23px;line-height:1.7;font-weight:600;color:#f0e5c8;margin-top:6px}
.s02 .txt em{color:var(--gold2);font-style:normal}
.s02 .next{position:absolute;right:32px;bottom:16px;color:var(--gold);font-size:22px}
.s02 .choices{position:absolute;z-index:7;right:90px;top:290px;width:520px;display:flex;flex-direction:column;gap:10px}
.s02 .cho{padding:14px 22px;background:linear-gradient(#3a2616f2,#24160cf2);border:2px solid #6b5330;border-radius:6px;color:#e9dcb8;font-weight:600;font-size:17px;box-shadow:0 8px 18px #000a;display:flex;gap:14px;align-items:center}
.s02 .cho .n{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2a1a05;font-family:Cinzel;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.s02 .cho.on{background:linear-gradient(#e7c670,#b9892d);color:#2a1a05;border-color:#fff1c0;box-shadow:0 0 0 3px #3a2616,0 8px 18px #000a}
.s02 .cho small{display:block;font-family:'Noto Sans KR';font-size:12px;font-weight:400;opacity:.75}
/* ---- screen 03 ---- */
.s03 .sh{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(30,16,6,.55),rgba(10,5,2,.92))}
.s03 .hd{position:absolute;left:0;right:0;top:44px;text-align:center}
.s03 .hd .kick{color:#cdb98c;font-size:13px}
.s03 .hd h1{font-weight:900;font-size:50px;color:var(--gold2);margin-top:4px;text-shadow:0 6px 18px #000}
.s03 .hd p{font-family:'Noto Sans KR';color:#cdb98c;font-size:16px;margin-top:6px}
.s03 .cards{position:absolute;left:100px;right:100px;top:226px;display:flex;gap:44px;justify-content:center}
.s03 .oc{width:520px;height:690px;padding:22px 26px;display:flex;flex-direction:column;align-items:center}
.s03 .oc.sel{transform:translateY(-16px);box-shadow:0 0 0 3px #5a4222,0 0 0 6px var(--gold2),0 0 60px #f3d98f77,0 24px 50px #000c}
.s03 .oc .pf{width:262px;margin-top:-4px}
.s03 .oc h3{font-weight:900;font-size:30px;margin-top:14px;color:#3a2410}
.s03 .oc .sub{font-family:'Noto Sans KR';font-size:13px;color:#7a5a2a;letter-spacing:2px;margin-top:2px}
.s03 .oc p{font-size:15px;line-height:1.65;font-weight:600;color:#3b2a18;margin-top:12px;text-align:center}
.s03 .st{width:100%;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.s03 .tr{width:100%;margin-top:14px;padding:10px 14px;border-radius:5px;background:#f6edd0;border:1.5px solid #8a6f3e;font-family:'Noto Sans KR';font-size:12.5px;line-height:1.55;color:#4a3418}
.s03 .tr b{color:#7b1710}
.s03 .tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);padding:5px 22px;border-radius:14px;background:linear-gradient(#e7c670,#b9892d);border:2px solid #fff1c0;color:#2a1a05;font-weight:900;font-size:14px;box-shadow:0 4px 10px #000a}
.s03 .bot{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;align-items:center;gap:30px}
.s03 .inp{height:56px;padding:0 24px;border-radius:6px;display:flex;align-items:center;gap:14px;font-weight:900;font-size:20px;min-width:420px}
.s03 .inp small{font-family:'Noto Sans KR';font-weight:400;font-size:12px;color:#7a5a2a}
/* ---- screen 04 ---- */
.s04 .lp{position:absolute;left:24px;top:478px;width:330px;padding:14px 18px 12px}
.s04 .lp .row{display:flex;gap:14px;align-items:center}
.s04 .lp h3{font-weight:900;font-size:21px;color:#3a2410}
.s04 .lp .sub{font-family:'Noto Sans KR';font-size:12px;color:#7a5a2a}
.s04 .goal{display:flex;gap:10px;align-items:flex-start;font-family:'Noto Sans KR';font-size:13px;font-weight:700;padding:7px 0;border-top:1px dashed #a88c5a}
.s04 .goal i{width:18px;height:18px;border:2px solid #6b5330;border-radius:3px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#1f6b2e;background:#f6edd0}
.s04 .goal small{display:block;font-weight:400;color:#7a5a2a;font-size:11px;margin-top:1px}
.s04 .rp{position:absolute;right:24px;top:528px;width:360px;padding:12px 18px 6px}
.s04 .rp h3{font-family:Cinzel;font-weight:800;letter-spacing:3px;font-size:13px;color:var(--gold2);margin-bottom:8px}
.s04 .pr{display:flex;gap:12px;align-items:center;padding:6px 0;border-top:1px solid #ffffff1c}
.s04 .pr .nm{flex:1;font-family:'Noto Sans KR'}
.s04 .pr .nm b{font-size:14px;color:#f0e5c8;display:block}
.s04 .pr .nm small{font-size:11px;color:#b9a67c}
.s04 .pr .tv{width:96px;font-family:'Noto Sans KR';font-size:11px;color:#cdb98c;text-align:right}
.s04 .pr .st{font-size:16px;width:22px;text-align:center}
.s04 .letters{position:absolute;left:24px;bottom:18px;width:330px;padding:12px 16px}
.s04 .letters .env{display:flex;gap:7px;margin-top:8px}
.s04 .ev{width:34px;height:24px;border-radius:3px;border:1.5px solid #6b5330;background:linear-gradient(#efe3c2,#cbb98a);position:relative;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:Cinzel;font-weight:800}
.s04 .ev.lock{background:#4a3a28;color:#8a7650;border-color:#3a2c1c}
.s04 .ev.glow{box-shadow:0 0 0 2px #f3d98f,0 0 16px #f3d98f}
.s04 .toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:10px 24px 10px 14px;background:linear-gradient(#3a2616f2,#24160cf2);border:2px solid var(--gold);border-radius:34px;color:#f0e5c8;box-shadow:0 10px 24px #000b;font-family:'Noto Sans KR';font-size:14px;font-weight:700;z-index:10}
.s04 .toast small{display:block;font-weight:400;font-size:11.5px;color:#cdb98c}
.s04 .endt{position:absolute;right:24px;bottom:18px;width:300px;height:76px;border-radius:38px;background:radial-gradient(circle at 50% 20%,#e7c670,#9b6f1f);border:3px solid #4a2f0a;box-shadow:0 0 0 3px var(--gold),0 8px 18px #000b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Cinzel;font-weight:800;font-size:22px;letter-spacing:3px;color:#2b1a05;text-shadow:0 1px 0 #ffe9b0}
.s04 .endt small{font-family:'Noto Sans KR';font-size:11px;letter-spacing:0;font-weight:700}

  function postRender() {
    if (V.screen === "earnings") {
      screenEl.querySelectorAll("[data-count]").forEach((el) => {
        const target = parseFloat(el.dataset.count), fmt = el.dataset.fmt;
        const t0 = performance.now();
        const step = (now) => {
          const k = Math.min(1, (now - t0) / 1300), v = target * (1 - Math.pow(1 - k, 3));
          el.textContent = fmt === "M" ? `+${fmtB(v)}` : fmtB(v);
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
      const cv = document.getElementById("coins");
      if (cv) {
        const c = cv.getContext("2d");
        const rnd = makeRng(G.turn * 97 + 5);
        for (let i = 0; i < 160; i++) {
          const x = rnd() * 1920, y = rnd() * 1080, r = 6 + rnd() * 9;
          if (y > 470 && y < 700 && x > 540 && x < 1380) continue;
          c.save();
          c.translate(x, y);
          c.rotate(rnd() * 6);
          c.scale(1, 0.4 + rnd() * 0.6);
          const g = c.createRadialGradient(-r * 0.3, -r * 0.3, 1, 0, 0, r);
          g.addColorStop(0, "#fff3b0");
          g.addColorStop(0.6, "#e0b030");
          g.addColorStop(1, "#8a5a10");
          c.fillStyle = g;
          c.globalAlpha = 0.55 + rnd() * 0.45;
          c.shadowColor = "rgba(255,210,90,.6)";
          c.shadowBlur = 10;
          c.beginPath();
          c.arc(0, 0, r, 0, 7);
          c.fill();
          c.restore();

      if (ctx === "pending") {
        const p = G.pending;
        if (p && p.kind === "letter") {
          openLetter(G, p.id);
          afterEvent();
          return;
        }
      }
      render();
    },
    "close-help"() {
      V.modal = null;
      V.help = false;
      openPending();
    },
    "read-letter"(d) {
      V.letterCtx = "view";
      V.modal = letterModal(d.id);
      render();
    },
    go(d) {
      if (d.to === "hub" || G) go(d.to);
    },
    "open-pending"() {
      openPending();
    },
    "end-turn"() {
      if (G.pending) {
        openPending();
        return;
      }
      endTurn(G);
      V.screen = "earnings";
      render();
    },
    "next-turn"() {
      nextTurn();
    },
    choose(d) {
      const p = G.pending;
      const ev = getEvent(G, p.id);
      const opt = ev.options[+d.i];
      const r = chooseOption(G, p.id, +d.i);
      if (!r.ok) return;
      V.es = { result: { label: opt.label, text: r.result, fx: opt.fx } };
      G.pending = p;
      render();
    },
    intel() {
      const p = G.pending;
      useIntelAction(G, p.id);
      render();
    },
    accuse(d) {
      const res = accuse(G, d.who || null);
      V.es = { result: res };
      render();
    },
    "event-continue"() {
      G.pending = null;
      afterEvent();
    },
    "pick-company"(d) {
      V.company = d.id;
      render();
    },
    "reset-levers"() {
      for (const k of Object.keys(G.comp[V.company].lev)) G.comp[V.company].lev[k] = 50;
      render();
    },
    buy(d) {
      if (buyItem(G, d.id)) render();
    },
    "pick-suspect"(d) {
      V.suspect = d.id;
      V.note = null;
      render();
    },
    investigate(d) {
      const r = investigate(G, d.id);
      V.note = r.text;
      render();
    }
  };
  stage.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    if (el.dataset.act === "close-letter" && e.target.closest(".letterbox") && !e.target.closest(".btn")) return;
    const fn = actions[el.dataset.act];
    if (fn) fn({ ...el.dataset });
  });
  stage.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.lev) {
      G.comp[V.company].lev[t.dataset.lev] = +t.value;
      const lab = document.getElementById(`lv-${t.dataset.lev}`);
      if (lab) lab.textContent = t.value;
      const prev = document.getElementById("prev");
      if (prev) prev.innerHTML = previewHTML(G, V.company);
    } else if (t.dataset.payout) {
      G.payout = +t.value;
      const pv = document.getElementById("payv");
      if (pv) pv.textContent = `${t.value}%`;
    }
  });
  stage.addEventListener("change", (e) => {
    if (e.target.dataset.payout) render();
    else if (e.target.dataset.lev) render();
  });
  addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && V.screen === "vn" && !V.steps[V.idx].choices && !V.modal) {
      e.preventDefault();
      actions["vn-next"]();
    }
  });
  window.__compact = { get G() {
    return G;
  }, V, S: state_exports, actions, render };
  async function boot() {
    await Promise.all([probeArt(), renderMap(document.getElementById("bg"))]);
    loading.remove();
    render();
  }
  boot();
})();
</script>
</body></html>
